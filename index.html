  var STORE = 'sjca_key_' + P.salt;
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function toB64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  async function derive(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256);
    return new Uint8Array(bits);
  }
  async function unlock(raw) {

    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var lock = document.getElementById('lock');
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    go.disabled = true; msg.textContent = 'Opening...';
    try {
      var raw = await derive(pw);
      var html = await unlock(raw);
      if (document.getElementById('rem').checked) { try { localStorage.setItem(STORE, toB64(raw)); } catch (x) {} }
      show(html);
    } catch (err) {
      go.disabled = false; msg.textContent = 'Wrong password. Try again.';
    }
  });

    var saved = null;
    try { saved = localStorage.getItem(STORE); } catch (x) {}

      try {
