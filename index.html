<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --btn:#1f6feb; }

  button { width:100%; padding:10px; font-size:16px; border:0; border-radius:6px; background:var(--btn); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  #msg { min-height:22px; margin-top:12px; color:var(--muted); font-size:14px; }
</style>
