<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --btn:#1f6feb; }

  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }

  h1 { font-size:20px; font-weight:600; margin:0 0 16px; }
  input[type=password] { width:100%; box-sizing:border-box; padding:10px 12px; font-size:16px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  label { display:flex; gap:8px; align-items:center; margin:12px 0 16px; color:var(--muted); font-size:15px; }
  button { width:100%; padding:10px; font-size:16px; border:0; border-radius:6px; background:var(--btn); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  #msg { min-height:22px; margin-top:12px; color:var(--muted); font-size:14px; }
</style>

    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var lock = document.getElementById('lock');
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    go.disabled = true; msg.textContent = 'Opening...';
    try {
      var raw = await derive(pw);
      var html = await unlock(raw);
      if (document.getElementById('rem').checked) { try { localStorage.setItem(STORE, toB64(raw)); } catch (x) {} }
      show(html);
    } catch (err) {
      go.disabled = false; msg.textContent = 'Wrong password. Try again.';
    }
  });

  (async function () {
    var saved = null;
    try { saved = localStorage.getItem(STORE); } catch (x) {}
    if (saved) {
      try {
        var html = await unlock(b64(saved));
        if (document.readyState !== 'complete') await new Promise(function (r) { window.addEventListener('load', r, { once: true }); });
        show(html); return;
      }
      catch (err) { try { localStorage.removeItem(STORE); } catch (x) {} }
    }
    lock.hidden = false;
    document.getElementById('pw').focus();
  })();
})();
</script>
